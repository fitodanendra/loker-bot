name: Cek Lowongan

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay a few minutes)
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write             # needed to save seen.json back to the repo

concurrency:
  group: loker-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest

      - name: Check new jobs and notify Telegram
        run: python -m loker_bot.main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save sent-job history and chosen categories
        run: |
          git config user.name "loker-bot"
          git config user.email "loker-bot@users.noreply.github.com"
          git add seen.json prefs.json
          git diff --cached --quiet || (git commit -m "chore: update seen jobs" && git push)
