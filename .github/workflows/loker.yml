name: Cek Lowongan

on:
  # Triggered every 10 minutes by cron-job.org (GitHub's own schedule proved unreliable).
  workflow_dispatch:          # also the "Run workflow" button for manual runs

permissions:
  contents: read              # state lives in the Cloudflare Worker, nothing is committed

concurrency:
  group: loker-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: |
          python -m unittest
          cd worker && node --test

      - name: Check new jobs and notify Telegram
        run: python -m loker_bot.main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_URL: ${{ secrets.STATE_URL }}
          STATE_SECRET: ${{ secrets.STATE_SECRET }}
